name: Repository validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Shell, Compose, and Terraform validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t scripts < <(
            find scripts -type f -name '*.sh' -print | sort
          )

          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts were found."
            exit 1
          fi

          printf 'Checking %s\n' "${scripts[@]}"

          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: Run ShellCheck
        run: shellcheck --external-sources --severity=warning scripts/*.sh

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose \
            --env-file .env \
            -f compose/compose.yaml \
            config --quiet

      - name: Install pinned Terraform
        shell: bash
        run: |
          sudo TERRAFORM_VERSION=1.16.0 \
            bash scripts/install-terraform.sh

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform providers
        working-directory: terraform/event-driven
        env:
          TF_IN_AUTOMATION: "1"
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform/event-driven
        env:
          TF_IN_AUTOMATION: "1"
        run: terraform validate

      - name: Check repository safety files
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "The local .env file must not be committed."
            exit 1
          fi

          if git ls-files |
            grep -E \
              '(^|/)\.terraform/|\.tfstate($|\.)|\.tfplan($|\.)|(^|/)terraform\.tfvars$|/build/.*\.zip$'
          then
            echo "Terraform runtime files must not be committed."
            exit 1
          fi

          git check-ignore .env
          git check-ignore terraform/event-driven/terraform.tfvars
          git check-ignore terraform/event-driven/.terraform/providers/example
          git check-ignore terraform/event-driven/build/example.zip

          test -f .env.example
          test -f .gitignore
          test -f terraform/event-driven/terraform.tfvars.example
          test -f terraform/event-driven/lambda/lambda_function.py
